<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CubePay Engine GIF Capture</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #1a1a1a;
        overflow: hidden;
      }
      #container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <script type="module">
      import { createRoot } from "https://esm.sh/react@18.2.0/client";
      import React from "https://esm.sh/react@18.2.0";
      import { Canvas } from "https://esm.sh/@react-three/fiber@8.13.0";
      import { Text, Box } from "https://esm.sh/@react-three/drei@9.77.0";

      // Simplified CubePay Cube Component
      function PaymentCube() {
        const meshRef = React.useRef();
        const [rotation, setRotation] = React.useState(0);

        // Auto-rotate
        React.useEffect(() => {
          const interval = setInterval(() => {
            setRotation((r) => r + 0.01);
          }, 16);
          return () => clearInterval(interval);
        }, []);

        React.useEffect(() => {
          if (meshRef.current) {
            meshRef.current.rotation.y = rotation;
            meshRef.current.rotation.x = rotation * 0.3;
          }
        }, [rotation]);

        const paymentMethods = {
          crypto_qr: { icon: "📱", text: "Crypto QR", color: "#00ff00" },
          virtual_card: { icon: "💳", text: "Virtual Card", color: "#0080ff" },
          bank_qr: { icon: "🔲", text: "Bank QR", color: "#004080" },
          voice_pay: { icon: "🎤", text: "Voice Pay", color: "#8000ff" },
          sound_pay: { icon: "🎵", text: "Sound Pay", color: "#ff8000" },
          onboard: { icon: "🚀", text: "On/Off Ramp", color: "#ffff00" },
        };

        const enabledFaces = Object.keys(paymentMethods);

        const facePositions = [
          [1.24, 0, 0],
          [-1.24, 0, 0],
          [0, 1.24, 0],
          [0, -1.24, 0],
          [0, 0, 1.24],
          [0, 0, -1.24],
        ];

        const faceRotations = [
          [0, Math.PI / 2, 0],
          [0, -Math.PI / 2, 0],
          [-Math.PI / 2, 0, 0],
          [Math.PI / 2, 0, 0],
          [0, 0, 0],
          [0, Math.PI, 0],
        ];

        return React.createElement(
          "group",
          null,
          React.createElement(
            "mesh",
            {
              ref: meshRef,
              position: [0, 0, -3],
            },
            React.createElement("boxGeometry", { args: [2.5, 2.5, 2.5] }),
            React.createElement("meshStandardMaterial", {
              color: "#00ff00",
              transparent: true,
              opacity: 0.85,
              emissive: "#004400",
              emissiveIntensity: 0.6,
              roughness: 0.1,
              metalness: 0.3,
            }),
          ),

          enabledFaces.map((method, index) => {
            const config = paymentMethods[method];
            const faceIndex = index % 6;

            return React.createElement(
              "group",
              { key: `face-${method}` },
              React.createElement(
                "mesh",
                {
                  position: facePositions[faceIndex],
                  rotation: faceRotations[faceIndex],
                },
                React.createElement("planeGeometry", { args: [2, 2] }),
                React.createElement("meshBasicMaterial", {
                  color: config.color,
                  transparent: true,
                  opacity: 0.2,
                }),
              ),

              React.createElement(
                Text,
                {
                  position: [
                    facePositions[faceIndex][0],
                    facePositions[faceIndex][1] + 0.3,
                    facePositions[faceIndex][2],
                  ],
                  rotation: faceRotations[faceIndex],
                  fontSize: 0.25,
                  color: "#ffffff",
                  anchorX: "center",
                  anchorY: "middle",
                  outlineWidth: 0.02,
                  outlineColor: "#000000",
                  fontWeight: "bold",
                },
                config.icon,
              ),

              React.createElement(
                Text,
                {
                  position: facePositions[faceIndex],
                  rotation: faceRotations[faceIndex],
                  fontSize: 0.15,
                  color: "#000000",
                  anchorX: "center",
                  anchorY: "middle",
                  outlineWidth: 0.01,
                  outlineColor: "#ffffff",
                  fontWeight: "bold",
                },
                config.text,
              ),
            );
          }),

          React.createElement("pointLight", {
            position: [0, 0, -1],
            color: "#00ff00",
            intensity: 0.8,
            distance: 12,
          }),
        );
      }

      // Render the scene
      const root = createRoot(document.getElementById("container"));
      root.render(
        React.createElement(
          Canvas,
          {
            camera: { position: [0, 0, 5], fov: 75 },
            style: { background: "transparent", width: "100%", height: "100%" },
          },
          React.createElement("ambientLight", { intensity: 0.4 }),
          React.createElement("directionalLight", {
            position: [10, 10, 5],
            intensity: 1,
          }),
          React.createElement(PaymentCube),
        ),
      );
    </script>
  </body>
</html>
